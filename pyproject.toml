[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hms-commander-mcp"
version = "0.1.0"
description = "Bounded read-only HEC-HMS text information through MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "CLB Engineering Corporation"}]
dependencies = ["mcp>=2.3.0,<3", "hms-commander>=0.3.1,<0.4", "pydantic>=2.12,<3", "packaging>=24"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.20"]

[project.scripts]
hms-commander-mcp = "hms_commander_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hms_commander_mcp"]
