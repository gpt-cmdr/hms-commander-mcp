name: Propose dependency refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging>=24'
      - name: Compare stable PyPI metadata and prepare candidate
        run: python scripts/propose_dependency_update.py --apply
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-review
          path: dependency-review.json
      - name: Open update PR if compatible lower bounds changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- pyproject.toml; then exit 0; fi
          branch='maintenance/dependency-refresh'
          # Refresh this owned branch's tracking ref so --force-with-lease works
          # on repeated runs from a shallow default-branch checkout.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git checkout -B "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml
          git commit -m 'Propose compatible dependency refresh'
          git push --force-with-lease origin "$branch"
          python - <<'PY'
          from pathlib import Path
          Path('pr-body.md').write_text('Proposes current stable versions within existing dependency ranges. Review the metadata artifact, exact compatibility evidence and wheel/sdist metadata before merge. No runtime upgrades, range widening, merge or publication are performed.\n')
          PY
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --head "$branch" --title 'Propose compatible dependency refresh' --body-file pr-body.md --draft
          fi
          # GITHUB_TOKEN-created PRs do not trigger ordinary pull_request CI.
          gh workflow run package-compatibility.yml --ref "$branch"
